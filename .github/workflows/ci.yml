name: SecureVault CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f services/engine/requirements.txt ]; then pip install -r services/engine/requirements.txt; fi

      - name: Run Pytest Suite
        run: |
          # Ensuring it doesn't fail if tests directory is empty or missing
          if [ -d services/engine/tests ]; then pytest services/engine/tests/; else echo "No tests found, skipping."; fi

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./services/frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./services/frontend
        run: npm run build
